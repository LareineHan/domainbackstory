<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain Backstory</title>
<style>
:root{--bg:#0c0c12;--panel:#15151d;--panel2:#1d1d27;--line:#302e3c;--text:#f6f3ff;--muted:#aaa6b8;--accent:#a786ff;--good:#7ed9ae;--warn:#f2cc73;--bad:#ef8796;--info:#83bdf0}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 15% 0,rgba(167,134,255,.12),transparent 26%),var(--bg);color:var(--text);font-family:Inter,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea,select{font:inherit}button{white-space:nowrap;cursor:pointer}
.wrap{max-width:1160px;margin:auto;padding:26px 16px 70px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.brand h1{margin:0;font-size:32px}.brand p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.55;max-width:760px}
.lang{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px}.lang button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px}.lang button.active{background:var(--accent);color:#150f20;font-weight:800}
.search{position:sticky;top:8px;z-index:20;display:flex;gap:8px;background:rgba(21,21,29,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:15px;padding:10px;margin:20px 0 10px}
.search input{flex:1;min-width:0;background:#101017;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.primary{background:var(--accent);color:#150f20}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.ghost{background:transparent;color:#d3c8ff;border:1px solid var(--line)}
.statusbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.status{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted)}.status.ok{color:var(--good);border-color:rgba(126,217,174,.3)}.status.err{color:var(--bad);border-color:rgba(239,135,150,.3)}.status.loading{color:var(--info)}
.summary{border:1px solid rgba(167,134,255,.28);background:linear-gradient(145deg,rgba(167,134,255,.10),rgba(131,189,240,.04));border-radius:18px;padding:18px;margin-bottom:14px}.eyebrow{font-size:11px;color:#c8b8ff;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.summary h2{margin:7px 0 7px;font-size:22px}.summary p{margin:0;color:var(--muted);line-height:1.55}.next{margin-top:12px;background:rgba(0,0,0,.16);border:1px solid var(--line);padding:11px 12px;border-radius:11px;font-size:13px}
.progress{height:4px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;width:35%;background:linear-gradient(90deg,var(--accent),var(--info));animation:move 1.2s ease-in-out infinite}@keyframes move{0%{transform:translateX(-130%)}100%{transform:translateX(390%)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px}.full{grid-column:1/-1}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:11px}.head h3{margin:0;font-size:15px}.hint{font-size:11px;color:var(--muted)}
.loadingRow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.spinner{width:22px;height:22px;border:2px solid rgba(167,134,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.notice{padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px}.notice b{display:block;margin-bottom:4px}.notice p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.notice.good{border-color:rgba(126,217,174,.26)}.notice.warn{border-color:rgba(242,204,115,.26)}.notice.bad{border-color:rgba(239,135,150,.26)}.notice.info{border-color:rgba(131,189,240,.26)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 10px;font-size:13px}.k{color:var(--muted)}.tag{display:inline-block;padding:4px 7px;border-radius:7px;border:1px solid var(--line)}.tag.good{color:var(--good)}.tag.warn{color:var(--warn)}.tag.info{color:var(--info)}
.infragrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.infra{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}.infra .label{font-size:11px;color:var(--muted);margin-bottom:5px}.infra .value{font-weight:800;font-size:14px}.infra .desc{font-size:12px;color:var(--muted);line-height:1.45;margin-top:6px}
.timeline{display:flex;gap:8px;overflow-x:auto}.event{min-width:175px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px}.date{font-size:11px;color:var(--muted);margin-bottom:5px}
details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:#cfc1ff;font-size:12px;font-weight:700}.raw{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.rawbox{background:#101017;border:1px solid var(--line);border-radius:9px;padding:8px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#ddd8ef;margin-top:4px}
textarea,select{width:100%;background:#101017;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}#headerText{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.pivot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.pivot:last-child{border:0}.pivot p{margin:3px 0 0;color:var(--muted);font-size:12px}.notes{display:grid;grid-template-columns:240px 1fr;gap:8px}.footer{text-align:center;margin-top:22px}
#topBtn{display:none;position:fixed;right:20px;bottom:20px;width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#150f20;font-size:19px;font-weight:900}#topBtn.show{display:block}
@media(max-width:780px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.infragrid,.raw,.notes{grid-template-columns:1fr}.top{display:block}.lang{margin-top:12px;width:max-content}.search{flex-wrap:wrap}.search input{min-width:100%}.kv{grid-template-columns:1fr}.pivot{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><h1>Domain Backstory</h1><p id="subtitle"></p></div>
    <div class="lang"><button id="ko">한국어</button><button id="en">English</button></div>
  </div>
  <div class="search"><input id="domain"><button id="go" class="btn primary"></button></div>
  <div class="statusbar"><span id="sr" class="status"></span><span id="sd" class="status"></span><span id="sw" class="status"></span></div>

  <section class="summary">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="sumTitle"></h2>
    <p id="sumBody"></p>
    <div class="next" id="sumNext"></div>
    <div id="sumProgress" class="progress" hidden><div></div></div>
  </section>

  <main class="grid">
    <section class="card"><div class="head"><h3 id="hSignals"></h3><span class="hint" id="hintSignals"></span></div><div id="signals"></div></section>
    <section class="card"><div class="head"><h3 id="hReg"></h3><span class="hint">RDAP</span></div><div id="reg"></div></section>
    <section class="card full"><div class="head"><h3 id="hLife"></h3></div><div id="life"></div></section>
    <section class="card full"><div class="head"><h3 id="hTime"></h3></div><div id="time"></div></section>
    <section class="card"><div class="head"><h3 id="hInfra"></h3></div><div id="infra"></div></section>
    <section class="card"><div class="head"><h3 id="hWeb"></h3><span class="hint">Wayback</span></div><div id="web"></div></section>

    <section class="card full"><div class="head"><h3 id="hHeader"></h3><span class="hint" id="headerHint"></span></div>
      <p id="headerHelp" style="color:var(--muted);font-size:12px"></p>
      <div class="actions" style="margin-bottom:8px"><input id="headerFile" type="file" accept=".txt,.eml,text/plain,message/rfc822"><button id="parse" class="btn secondary"></button><button id="useFrom" class="btn ghost"></button></div>
      <textarea id="headerText"></textarea><div id="headerResult"></div>
    </section>

    <section class="card full"><div class="head"><h3 id="hPivots"></h3></div>
      <div class="pivot"><div><b>VirusTotal</b><p id="dVT"></p></div><button id="vt" class="btn secondary">VirusTotal</button></div>
      <div class="pivot"><div><b>Cisco Talos</b><p id="dTalos"></p></div><button id="talos" class="btn secondary">Talos</button></div>
      <div class="pivot"><div><b>Historical WHOIS</b><p id="dWhois"></p></div><div class="actions"><button id="dt" class="btn ghost">DomainTools</button><button id="st" class="btn ghost">SecurityTrails</button></div></div>
      <div class="pivot"><div><b>Wayback</b><p id="dWay"></p></div><button id="way" class="btn ghost">Wayback</button></div>
    </section>

    <section class="card full"><div class="head"><h3 id="hNotes"></h3></div><div class="notes"><select id="disp"></select><textarea id="notes"></textarea></div><div class="actions" style="margin-top:9px"><button id="save" class="btn primary"></button><button id="copy" class="btn secondary"></button></div><div id="saved" style="color:var(--muted);font-size:12px;margin-top:7px"></div></section>
  </main>

  <div class="footer"><button id="bottomTop" class="btn secondary"></button></div>
</div>
<button id="topBtn">↑</button>

<script>
const $=s=>document.querySelector(s);
let LANG=localStorage.getItem("db_lang")||"ko";
let STATE=null, HEADER=null, requestToken=0;

const TXT={
 ko:{subtitle:"수상한 발신 도메인의 등록정보, 현재 인프라, 과거 웹 흔적, 이메일 헤더를 빠르게 비교합니다.",ph:"도메인, 이메일 주소 또는 URL",go:"조사하기",regWait:"등록정보: 대기",dnsWait:"인프라: 대기",webWait:"Wayback: 대기",quick:"빠른 요약",enter:"도메인을 입력해 주세요.",enterBody:"검색하면 완료되는 결과부터 바로 표시됩니다.",next:"다음 조사",start:"도메인을 먼저 조사하세요.",signals:"한눈에 보기",sigHint:"판단에 필요한 신호만",reg:"등록 라이프사이클",life:"재등록 / 재사용 가능성",time:"등록 타임라인",infra:"현재 인프라",web:"과거 웹 기록",header:"이메일 헤더 분석",headerHint:"브라우저에서만 처리",headerHelp:"Defender에서 복사한 raw header를 붙여넣거나 .txt/.eml 파일을 올리세요. 헤더 원문은 서버로 전송하지 않습니다.",parse:"헤더 분석",useFrom:"From 도메인 사용",headerPH:"raw Internet headers를 붙여넣으세요...",pivots:"추가 조사 바로가기",dVT:"도메인 평판과 탐지 결과 확인",dTalos:"도메인/IP 평판 수동 확인",dWhois:"과거 registrar/registrant와 재등록 이력 확인",dWay:"과거 사이트의 정체성과 용도 변화 비교",notes:"분석 메모",save:"로컬 저장",copy:"요약 복사",top:"↑ 맨 위로",loading:"조회 중",done:"확인됨",failed:"조회 불가",timeout:"시간 초과",loadingTitle:"조사 중",loadingBody:"등록정보와 인프라를 동시에 확인하고 있습니다. 끝나는 항목부터 표시합니다.",waitingNext:"느린 소스가 있어도 전체 화면은 기다리지 않습니다.",old:"오래 유지된 등록정보",changed:"최근 등록정보 변경",recent:"최근 등록",transfer:"최근 registrar transfer",noSignal:"강한 lifecycle 이상 신호 없음",inbound:"수신 메일 경로",outbound:"SPF상 발신 허용 단서",webDest:"웹/호스트 목적지",dnsMgmt:"DNS 관리",raw:"원본 DNS 보기",none:"없음",mxExplain:"MX는 수신 메일 경로입니다. 특정 메일의 실제 발송 provider와 직접 비교하면 안 됩니다.",nextGeneric:"VirusTotal/Talos 평판과 실제 메일 행위를 함께 확인하세요.",nextChanged:"Historical WHOIS/DNS와 실제 발송 행위를 함께 확인하세요.",nextRecent:"공격자 신규 등록 인프라 가능성을 우선 확인하세요.",disp:["판정 없음","공격자 신규 등록 가능성","재등록 / 재사용 가능성","정상 계정/서비스 compromise 가능성","도메인/인프라 takeover 가능성","정상 서비스 악용 가능성","정상 또는 근거 부족","추가 조사 필요"]},
 en:{subtitle:"Quickly compare registration, current infrastructure, historical web evidence, and email headers for suspicious sender domains.",ph:"Domain, email address, or URL",go:"Investigate",regWait:"Registration: waiting",dnsWait:"Infrastructure: waiting",webWait:"Wayback: waiting",quick:"Quick summary",enter:"Enter a domain to begin.",enterBody:"Results appear as each source finishes.",next:"Next step",start:"Investigate a domain first.",signals:"What stands out",sigHint:"Decision-useful signals only",reg:"Registration lifecycle",life:"Possible re-registration / repurposing",time:"Registration timeline",infra:"Current infrastructure",web:"Historical web evidence",header:"Email header analyzer",headerHint:"Browser-only",headerHelp:"Paste a raw header copied from Defender or upload a .txt/.eml file. The raw header is not sent to the server.",parse:"Analyze header",useFrom:"Use From domain",headerPH:"Paste raw Internet headers here...",pivots:"Deep investigation pivots",dVT:"Check domain reputation and detections",dTalos:"Manually check domain/IP reputation",dWhois:"Check registrar/registrant history and re-registration",dWay:"Compare historical site identity and purpose",notes:"Analyst notes",save:"Save locally",copy:"Copy summary",top:"↑ Back to top",loading:"Loading",done:"OK",failed:"Unavailable",timeout:"Timed out",loadingTitle:"Investigating",loadingBody:"Registration and infrastructure are checked in parallel. Each result appears as soon as it finishes.",waitingNext:"Slow sources do not block the whole page.",old:"Long-established registration",changed:"Recent registration change",recent:"Recently registered",transfer:"Recent registrar transfer",noSignal:"No strong lifecycle anomaly",inbound:"Inbound mail routing",outbound:"SPF outbound clues",webDest:"Web / host destination",dnsMgmt:"DNS management",raw:"Show raw DNS",none:"None",mxExplain:"MX describes inbound routing. Do not compare it directly with the sending provider of a specific message.",nextGeneric:"Check VirusTotal/Talos reputation and actual mail behavior.",nextChanged:"Check historical WHOIS/DNS together with actual sending behavior.",nextRecent:"Prioritize attacker-controlled infrastructure as a hypothesis.",disp:["No disposition yet","Likely attacker-registered","Possible re-registered / repurposed domain","Possible legitimate account/service compromise","Possible domain/infrastructure takeover","Likely legitimate service abuse","Benign / insufficient evidence","Needs more investigation"]}
};
const T=k=>TXT[LANG][k];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=x=>{if(!x)return"—";const d=new Date(x);return isNaN(d)?String(x):d.toLocaleDateString(LANG==="ko"?"ko-KR":"en-US")};
const ago=x=>{if(!x)return null;const d=new Date(x);return isNaN(d)?null:Math.floor((Date.now()-d)/86400000)};
const clean=x=>{x=(x||"").trim().toLowerCase();if(x.includes("@")&&!x.includes("://"))x=x.split("@").pop();try{if(x.includes("://"))x=new URL(x).hostname}catch{}return x.split("/")[0].split(":")[0].replace(/^\.+|\.+$/g,"")};
function status(el,state,text){el.className="status "+state;el.textContent=text}
function loader(){return `<div class="loadingRow"><div class="spinner"></div><span>${esc(T("loading"))}…</span></div>`}
function provider(items){const s=(items||[]).join(" ").toLowerCase();const r=[["Sophos",["sophos"]],["Microsoft 365",["protection.outlook.com"]],["Google Workspace",["google"]],["Proofpoint",["pphosted","proofpoint"]],["Mimecast",["mimecast"]],["Cloudflare",["cloudflare"]]];for(const [n,a] of r)if(a.some(x=>s.includes(x)))return n;return null}
function spfProviders(spf){const s=String(spf||"").toLowerCase(),o=[];for(const [n,a] of [["Microsoft 365",["spf.protection.outlook.com"]],["Google Workspace",["_spf.google.com"]],["Mailgun",["mailgun"]],["SendGrid",["sendgrid"]],["Amazon SES",["amazonses"]],["Mandrill",["mandrill"]],["Proofpoint",["pphosted"]],["Sophos",["sophos"]],["Mimecast",["mimecast"]]])if(a.some(x=>s.includes(x)))o.push(n);return o}
async function api(path,ms){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{const r=await fetch(path,{signal:c.signal});let j;try{j=await r.json()}catch{throw new Error("HTTP "+r.status)}if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j}
 catch(e){if(e.name==="AbortError")throw new Error(T("timeout"));throw e}finally{clearTimeout(t)}
}

function setLang(lang){
 LANG=lang;localStorage.setItem("db_lang",lang);document.documentElement.lang=lang;$("#ko").classList.toggle("active",lang==="ko");$("#en").classList.toggle("active",lang==="en");
 $("#subtitle").textContent=T("subtitle");$("#domain").placeholder=T("ph");$("#go").textContent=T("go");$("#eyebrow").textContent=T("quick");$("#hSignals").textContent=T("signals");$("#hintSignals").textContent=T("sigHint");$("#hReg").textContent=T("reg");$("#hLife").textContent=T("life");$("#hTime").textContent=T("time");$("#hInfra").textContent=T("infra");$("#hWeb").textContent=T("web");$("#hHeader").textContent=T("header");$("#headerHint").textContent=T("headerHint");$("#headerHelp").textContent=T("headerHelp");$("#parse").textContent=T("parse");$("#useFrom").textContent=T("useFrom");$("#headerText").placeholder=T("headerPH");$("#hPivots").textContent=T("pivots");$("#dVT").textContent=T("dVT");$("#dTalos").textContent=T("dTalos");$("#dWhois").textContent=T("dWhois");$("#dWay").textContent=T("dWay");$("#hNotes").textContent=T("notes");$("#save").textContent=T("save");$("#copy").textContent=T("copy");$("#bottomTop").textContent=T("top");
 const idx=$("#disp").selectedIndex;$("#disp").innerHTML=T("disp").map(x=>`<option>${esc(x)}</option>`).join("");$("#disp").selectedIndex=Math.max(0,idx);
 if(!STATE){status($("#sr"),"",T("regWait"));status($("#sd"),"",T("dnsWait"));status($("#sw"),"",T("webWait"));$("#sumTitle").textContent=T("enter");$("#sumBody").textContent=T("enterBody");$("#sumNext").innerHTML=`<b>${esc(T("next"))}:</b> ${esc(T("start"))}`;$("#sumProgress").hidden=true}
 else renderAll();
}

function initLoading(domain){
 STATE={domain,reg:null,dns:null,mail:null,web:null,err:{},pending:{reg:true,dns:true,web:true}};
 $("#sumTitle").textContent=T("loadingTitle");$("#sumBody").textContent=T("loadingBody");$("#sumNext").innerHTML=`<b>${esc(T("next"))}:</b> ${esc(T("waitingNext"))}`;$("#sumProgress").hidden=false;
 $("#signals").innerHTML=loader();$("#reg").innerHTML=loader();$("#life").innerHTML=loader();$("#time").innerHTML=loader();$("#infra").innerHTML=loader();$("#web").innerHTML=loader();
 status($("#sr"),"loading",LANG==="ko"?"등록정보: 조회 중":"Registration: loading");status($("#sd"),"loading",LANG==="ko"?"인프라: 조회 중":"Infrastructure: loading");status($("#sw"),"loading","Wayback: loading");
}

async function investigate(){
 const d=clean($("#domain").value);if(!d||!d.includes("."))return alert(LANG==="ko"?"유효한 도메인을 입력하세요.":"Enter a valid domain.");
 $("#domain").value=d;const token=++requestToken;initLoading(d);

 const regP=api("/api/rdap?domain="+encodeURIComponent(d),14000).then(x=>{if(token!==requestToken)return;STATE.reg=x;STATE.pending.reg=false;status($("#sr"),"ok",LANG==="ko"?"등록정보: 확인됨":"Registration: OK");renderRegistration();renderSignals();renderLife();renderTime();renderSummary()}).catch(e=>{if(token!==requestToken)return;STATE.err.reg=e.message;STATE.pending.reg=false;status($("#sr"),"err",LANG==="ko"?"등록정보: 조회 불가":"Registration: unavailable");renderRegistration();renderSignals();renderLife();renderTime();renderSummary()});
 const dnsP=api("/api/dns?domain="+encodeURIComponent(d),9000).then(x=>{if(token!==requestToken)return;STATE.dns=x;STATE.pending.dns=false;status($("#sd"),"ok",LANG==="ko"?"인프라: 확인됨":"Infrastructure: OK");renderInfra();renderSignals();renderSummary()}).catch(e=>{if(token!==requestToken)return;STATE.err.dns=e.message;STATE.pending.dns=false;status($("#sd"),"err",LANG==="ko"?"인프라: 조회 불가":"Infrastructure: unavailable");renderInfra();renderSummary()});
 api("/api/maildns?domain="+encodeURIComponent(d),8000).then(x=>{if(token!==requestToken)return;STATE.mail=x;renderInfra();renderSummary();if(HEADER)renderHeader()}).catch(()=>{});
 api("/api/wayback?domain="+encodeURIComponent(d),8000).then(x=>{if(token!==requestToken)return;STATE.web=x;STATE.pending.web=false;status($("#sw"),"ok","Wayback: OK");renderWeb();renderLife();renderTime();renderSummary()}).catch(e=>{if(token!==requestToken)return;STATE.err.web=e.message;STATE.pending.web=false;status($("#sw"),"err","Wayback: unavailable");renderWeb();renderLife();renderTime();renderSummary()});
 await Promise.allSettled([regP,dnsP]); if(token!==requestToken)return;$("#sumProgress").hidden=true;renderSummary();loadSaved();
}

function renderSummary(){
 if(!STATE)return;const r=STATE.reg||{},d=STATE.dns||{},m=STATE.mail||{},bits=[];let title=T("noSignal"),next=T("nextGeneric");
 if(r.created){const n=ago(r.created);if(n<90){title=T("recent");next=T("nextRecent");bits.push(LANG==="ko"?`현재 등록 ${n}일`:`Current registration ${n} days`)}else if(n>1825){title=T("old");bits.push(LANG==="ko"?`현재 등록 약 ${Math.floor(n/365.25)}년`:`Current registration about ${Math.floor(n/365.25)} years`)}}
 if(r.changed&&ago(r.changed)>=0&&ago(r.changed)<30){title=LANG==="ko"?"오래된 도메인이지만 최근 변경 확인 필요":"Established domain with recent change";next=T("nextChanged");bits.push(LANG==="ko"?`등록정보 ${ago(r.changed)}일 전 변경`:`Registration changed ${ago(r.changed)} days ago`)}
 const ip=provider(d.MX||[]);if(ip)bits.push((LANG==="ko"?"수신 메일: ":"Inbound mail: ")+ip);const outs=spfProviders(m.spf||"");if(outs.length)bits.push("SPF: "+outs.join(", "));
 $("#sumTitle").textContent=title;$("#sumBody").textContent=bits.length?bits.join(" · "):(LANG==="ko"?"완료된 소스에서 강한 신호가 없습니다.":"No strong signal in completed sources.");$("#sumNext").innerHTML=`<b>${esc(T("next"))}:</b> ${esc(next)}`;
 if(!STATE.pending.reg&&!STATE.pending.dns)$("#sumProgress").hidden=true;
}
function renderSignals(){const r=STATE.reg||{},a=[];if(r.created&&ago(r.created)<90)a.push(["bad",T("recent"),LANG==="ko"?`현재 등록이 ${ago(r.created)}일 전 시작됐습니다.`:`Current registration started ${ago(r.created)} days ago.`]);if(r.changed&&ago(r.changed)>=0&&ago(r.changed)<30)a.push(["warn",T("changed"),LANG==="ko"?`RDAP 등록정보가 ${ago(r.changed)}일 전 변경됐습니다.`:`RDAP changed ${ago(r.changed)} days ago.`]);if(r.created&&ago(r.created)>1825)a.push(["good",T("old"),LANG==="ko"?`현재 lifecycle 약 ${Math.floor(ago(r.created)/365.25)}년`:`Current lifecycle about ${Math.floor(ago(r.created)/365.25)} years`]);$("#signals").innerHTML=a.length?a.map(([c,t,b])=>`<div class="notice ${c}"><b>${esc(t)}</b><p>${esc(b)}</p></div>`).join(""):`<div class="notice info"><b>${esc(T("noSignal"))}</b><p>${esc(T("nextGeneric"))}</p></div>`}
function renderRegistration(){if(!STATE.reg){$("#reg").innerHTML=`<div class="notice info"><b>${esc(T("failed"))}</b><p>${esc(STATE.err.reg||"")}</p></div><div class="actions"><button class="btn secondary" onclick="window.open('https://lookup.icann.org/en/lookup?name=${encodeURIComponent(STATE.domain)}','_blank')">ICANN</button><button class="btn ghost" onclick="window.open('https://whois.domaintools.com/${encodeURIComponent(STATE.domain)}','_blank')">WHOIS</button></div>`;return}const r=STATE.reg;$("#reg").innerHTML=`<div class="kv"><div class="k">${LANG==="ko"?"현재 등록 시작":"Created"}</div><div>${fmt(r.created)}</div><div class="k">${LANG==="ko"?"등록정보 변경":"Changed"}</div><div>${fmt(r.changed)}</div><div class="k">${LANG==="ko"?"Registrar transfer":"Registrar transfer"}</div><div>${fmt(r.transfer)}</div><div class="k">${LANG==="ko"?"만료일":"Expires"}</div><div>${fmt(r.expires)}</div><div class="k">Registrar</div><div>${esc(r.registrar||"—")}</div><div class="k">${LANG==="ko"?"네임서버":"Nameservers"}</div><div>${esc((r.nameservers||[]).join(", ")||"—")}</div></div>`}
function renderLife(){if(STATE.pending.reg){$("#life").innerHTML=loader();return}if(!STATE.reg){$("#life").innerHTML=`<div class="notice info"><b>${esc(T("failed"))}</b><p>${LANG==="ko"?"등록정보가 없어 lifecycle 추정은 하지 않습니다.":"No lifecycle inference without registration data."}</p></div>`;return}let earlier=false,gap=null;if(STATE.reg.created&&STATE.web?.oldest?.available&&STATE.web.oldest.timestamp){gap=Math.round((new Date(STATE.reg.created)-new Date(STATE.web.oldest.timestamp))/86400000);earlier=gap>30}$("#life").innerHTML=`<div class="notice ${earlier?"warn":"info"}"><b>${earlier?(LANG==="ko"?"이전 lifecycle 흔적 가능":"Possible earlier lifecycle"):(LANG==="ko"?"확정 가능한 재등록 이력 없음":"No confirmed re-registration history")}</b><p>${earlier?(LANG==="ko"?`현재 등록보다 약 ${(gap/365.25).toFixed(1)}년 앞선 웹 사본이 있습니다. Historical WHOIS로 확인하세요.`:`Archived web evidence predates current registration by about ${(gap/365.25).toFixed(1)} years.`):(LANG==="ko"?"무료 RDAP만으로 재등록 횟수와 inactive gap은 정확히 알 수 없습니다.":"Free RDAP cannot determine exact re-registration count or inactive gaps.")}</p></div>`}
function renderTime(){if(STATE.pending.reg){$("#time").innerHTML=loader();return}const r=STATE.reg||{},w=STATE.web||{},e=[];if(w.oldest?.timestamp)e.push([w.oldest.timestamp,LANG==="ko"?"과거 웹 사본":"Archived web copy"]);if(r.created)e.push([r.created,LANG==="ko"?"현재 등록 시작":"Registration created"]);if(r.transfer)e.push([r.transfer,"Registrar transfer"]);if(r.changed)e.push([r.changed,LANG==="ko"?"등록정보 변경":"Registration changed"]);if(r.expires)e.push([r.expires,LANG==="ko"?"등록 만료":"Expires"]);e.sort((a,b)=>new Date(a[0])-new Date(b[0]));$("#time").innerHTML=e.length?`<div class="timeline">${e.map(([d,t])=>`<div class="event"><div class="date">${fmt(d)}</div><b>${esc(t)}</b></div>`).join("")}</div>`:`<div style="color:var(--muted);font-size:12px">${esc(T("none"))}</div>`}
function rawBox(t,a){return `<div class="rawbox"><b>${t}</b>${(a||[]).length?(a||[]).map(v=>`<div class="mono">${esc(v)}</div>`).join(""):`<div style="color:var(--muted);font-size:11px">${esc(T("none"))}</div>`}</div>`}
function renderInfra(){if(STATE.pending.dns){$("#infra").innerHTML=loader();return}if(!STATE.dns){$("#infra").innerHTML=`<div class="notice info"><b>${esc(T("failed"))}</b><p>${esc(STATE.err.dns||"")}</p></div>`;return}const d=STATE.dns,m=STATE.mail||{},inb=provider(d.MX||[])||T("none"),outs=spfProviders(m.spf||[]),web=(d.A||[]).join(", ")||(d.CNAME||[]).join(", ")||T("none");$("#infra").innerHTML=`<div class="infragrid"><div class="infra"><div class="label">${T("webDest")}</div><div class="value">${esc(web)}</div><div class="desc">${LANG==="ko"?"현재 root domain이 향하는 IP/호스트입니다.":"Current root-domain destination."}</div></div><div class="infra"><div class="label">${T("inbound")}</div><div class="value">${esc(inb)}</div><div class="desc">${esc(T("mxExplain"))}</div></div><div class="infra"><div class="label">${T("outbound")}</div><div class="value">${esc(outs.length?outs.join(", "):T("none"))}</div><div class="desc">${esc(m.spf||"")}</div></div><div class="infra"><div class="label">${T("dnsMgmt")}</div><div class="value">${esc((d.NS||[]).join(" · ")||T("none"))}</div></div></div><details><summary>${esc(T("raw"))}</summary><div class="raw">${rawBox("A",d.A)}${rawBox("AAAA",d.AAAA)}${rawBox("MX",d.MX)}${rawBox("NS",d.NS)}${rawBox("CNAME",d.CNAME)}${rawBox("SOA",d.SOA)}</div></details>`}
function renderWeb(){if(STATE.pending.web){$("#web").innerHTML=loader();return}if(!STATE.web){$("#web").innerHTML=`<div class="notice info"><b>${esc(T("failed"))}</b><p>${esc(STATE.err.web||"")}</p></div>`;return}const w=STATE.web;$("#web").innerHTML=`<div class="kv"><div class="k">${LANG==="ko"?"오래된 사본":"Older snapshot"}</div><div>${fmt(w.oldest?.timestamp)}</div><div class="k">${LANG==="ko"?"최근 사본":"Latest snapshot"}</div><div>${fmt(w.latest?.timestamp)}</div></div><div class="notice info" style="margin-top:8px"><p>${LANG==="ko"?"Wayback snapshot은 당시 웹페이지 사본이며 사이트 생성일이나 소유권 변경일을 뜻하지 않습니다.":"A Wayback snapshot is an archived copy, not a creation or ownership-change date."}</p></div>`}
function renderAll(){renderSummary();renderSignals();renderRegistration();renderLife();renderTime();renderInfra();renderWeb();if(HEADER)renderHeader()}

/* lightweight header parser */
function unfold(raw){return raw.replace(/\r?\n[ \t]+/g," ")}function hv(raw,n){const u=unfold(raw),re=new RegExp("^"+n+":\\s*(.*)$","gmi");let m,a=[];while((m=re.exec(u)))a.push(m[1].trim());return a}function emailDomain(s){const m=String(s||"").match(/@([A-Za-z0-9.-]+\.[A-Za-z]{2,})/);return m?m[1].toLowerCase():null}
function parseHeader(raw){const from=hv(raw,"From")[0]||"",ret=hv(raw,"Return-Path")[0]||"",auth=hv(raw,"Authentication-Results").join(" ; "),received=hv(raw,"Received").join("\n");return{fromDomain:emailDomain(from),returnDomain:emailDomain(ret),spf:(auth.match(/\bspf=(pass|fail|softfail|neutral|none)\b/i)||[])[1]||null,dkim:(auth.match(/\bdkim=(pass|fail|none)\b/i)||[])[1]||null,dmarc:(auth.match(/\bdmarc=(pass|fail|none)\b/i)||[])[1]||null,dkimDomain:(auth.match(/header\.d=([^\s;]+)/i)||[])[1]||null,provider:(()=>{const s=(received+" "+auth).toLowerCase();for(const [n,a] of [["Mailgun",["mailgun"]],["SendGrid",["sendgrid"]],["Mandrill",["mandrill"]],["Amazon SES",["amazonses"]],["Microsoft 365",["protection.outlook.com"]],["Google Workspace",["google"]],["Proofpoint",["pphosted","proofpoint"]],["Sophos",["sophos"]]])if(a.some(x=>s.includes(x)))return n;return null})()}}
function renderHeader(){const h=HEADER;if(!h)return;$("#headerResult").innerHTML=`<div class="kv" style="margin-top:10px"><div class="k">From</div><div>${esc(h.fromDomain||"—")}</div><div class="k">Return-Path</div><div>${esc(h.returnDomain||"—")}</div><div class="k">DKIM d=</div><div>${esc(h.dkimDomain||"—")}</div><div class="k">Provider</div><div>${esc(h.provider||"—")}</div><div class="k">SPF / DKIM / DMARC</div><div>${esc([h.spf,h.dkim,h.dmarc].map(x=>x||"—").join(" / "))}</div></div>${h.spf==="pass"&&h.dkim==="pass"&&h.dmarc==="pass"?`<div class="notice warn" style="margin-top:8px"><b>${LANG==="ko"?"인증은 통과함":"Authentication passed"}</b><p>${LANG==="ko"?"메일 자체가 악성이라면 단순 spoofing보다 정상 계정·SaaS·API 자격증명 악용 가능성을 확인할 가치가 있습니다.":"If the message is malicious, investigate compromised mailbox/SaaS/API credentials rather than simple spoofing."}</p></div>`:""}`}
function loadSaved(){if(!STATE)return;const x=JSON.parse(localStorage.getItem("db:"+STATE.domain)||"null");if(x){$("#disp").selectedIndex=x.i||0;$("#notes").value=x.n||""}}
function open(kind){const d=STATE?.domain||clean($("#domain").value);if(!d)return;const u={vt:"https://www.virustotal.com/gui/domain/"+encodeURIComponent(d),talos:"https://www.talosintelligence.com/reputation_center",dt:"https://whois.domaintools.com/"+encodeURIComponent(d),st:"https://securitytrails.com/domain/"+encodeURIComponent(d)+"/history",way:"https://web.archive.org/web/*/"+encodeURIComponent(d)+"/*"};window.open(u[kind],"_blank","noopener")}

$("#go").onclick=investigate;$("#domain").onkeydown=e=>{if(e.key==="Enter")investigate()};$("#ko").onclick=()=>setLang("ko");$("#en").onclick=()=>setLang("en");
$("#headerFile").onchange=async e=>{const f=e.target.files?.[0];if(f)$("#headerText").value=await f.text()};$("#parse").onclick=()=>{const raw=$("#headerText").value;if(!raw.trim())return;HEADER=parseHeader(raw);renderHeader()};$("#useFrom").onclick=()=>{if(HEADER?.fromDomain){$("#domain").value=HEADER.fromDomain;investigate()}};
$("#vt").onclick=()=>open("vt");$("#talos").onclick=()=>open("talos");$("#dt").onclick=()=>open("dt");$("#st").onclick=()=>open("st");$("#way").onclick=()=>open("way");
$("#save").onclick=()=>{if(!STATE)return;localStorage.setItem("db:"+STATE.domain,JSON.stringify({i:$("#disp").selectedIndex,n:$("#notes").value}));$("#saved").textContent=LANG==="ko"?"저장됨":"Saved"};$("#copy").onclick=async()=>{await navigator.clipboard.writeText($("#sumTitle").textContent+"\n"+$("#sumBody").textContent+"\n"+$("#sumNext").textContent);$("#saved").textContent=LANG==="ko"?"요약 복사됨":"Summary copied"};
$("#bottomTop").onclick=()=>window.scrollTo({top:0});$("#topBtn").onclick=()=>window.scrollTo({top:0});window.addEventListener("scroll",()=>$("#topBtn").classList.toggle("show",window.scrollY>600));
setLang(LANG);
</script>
