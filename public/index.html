<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain Backstory</title>
<style>
:root{
  --bg:#0b0b10; --surface:#14141b; --surface2:#1b1b24; --surface3:#20202b;
  --border:#2d2b38; --text:#f5f3ff; --muted:#a9a5b8;
  --accent:#a786ff; --accent2:#7b61d9;
  --good:#7dd9ad; --warn:#f1c96b; --bad:#ef8291; --info:#7fbbef;
  --shadow:0 10px 30px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(circle at 12% -10%, rgba(167,134,255,.12), transparent 28%),
  radial-gradient(circle at 95% 8%, rgba(127,187,239,.08), transparent 22%),
  var(--bg);
  color:var(--text);
  font-family:Inter,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
  word-break:keep-all; overflow-wrap:break-word;
}
button,input,textarea,select{font:inherit}
button{white-space:nowrap}
a{color:#c8b8ff;text-decoration:none}
a:hover{text-decoration:underline}
.shell{max-width:1180px;margin:0 auto;padding:26px 18px 72px}
.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}
.brand h1{margin:0;font-size:32px;letter-spacing:-.035em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.55;max-width:770px}
.langswitch{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;flex:0 0 auto}
.langswitch button{border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.langswitch button.active{background:var(--accent);color:#120e1d;font-weight:800}
.searchbar{
  position:sticky;top:10px;z-index:20;
  display:flex;gap:10px;padding:10px;background:rgba(20,20,27,.92);
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);margin-bottom:12px
}
.searchbar input{flex:1;min-width:0;border:1px solid var(--border);background:#0f0f15;color:var(--text);padding:13px 14px;border-radius:11px;outline:none}
.searchbar input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--accent);color:#120e1d}
.btn.secondary{background:var(--surface3);color:var(--text);border:1px solid var(--border)}
.btn.ghost{background:transparent;color:#d4c8ff;border:1px solid var(--border)}
.statusline{display:flex;gap:7px;flex-wrap:wrap;margin:10px 2px 16px}
.status{font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.status.ok{color:var(--good);border-color:rgba(125,217,173,.28)}
.status.fail{color:var(--bad);border-color:rgba(239,130,145,.28)}
.status.wait{color:var(--muted)}
.heroSummary{
  background:linear-gradient(145deg,rgba(167,134,255,.11),rgba(127,187,239,.05));
  border:1px solid rgba(167,134,255,.26);border-radius:18px;padding:18px;margin-bottom:16px
}
.heroSummary .eyebrow{font-size:12px;color:#cbbdff;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.heroSummary h2{margin:7px 0 8px;font-size:22px;letter-spacing:-.025em}
.heroSummary p{margin:0;color:var(--muted);line-height:1.6}
.next{margin-top:13px;padding:12px 14px;background:rgba(11,11,16,.45);border:1px solid var(--border);border-radius:12px;font-size:14px}
.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 1px 0 rgba(255,255,255,.01)}
.card.full{grid-column:1/-1}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.cardhead h3{margin:0;font-size:15px;letter-spacing:-.01em}
.cardhead .hint{font-size:11px;color:var(--muted)}
.notice{padding:12px 13px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);margin-bottom:10px}
.notice.good{border-color:rgba(125,217,173,.25);background:rgba(125,217,173,.06)}
.notice.warn{border-color:rgba(241,201,107,.25);background:rgba(241,201,107,.06)}
.notice.bad{border-color:rgba(239,130,145,.25);background:rgba(239,130,145,.06)}
.notice.info{border-color:rgba(127,187,239,.25);background:rgba(127,187,239,.06)}
.notice b{display:block;margin-bottom:4px}
.notice p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 12px;font-size:13px}
.k{color:var(--muted)}
.v{min-width:0}
.tag{display:inline-block;padding:4px 7px;border-radius:8px;border:1px solid var(--border)}
.tag.good{color:var(--good);background:rgba(125,217,173,.07)}
.tag.warn{color:var(--warn);background:rgba(241,201,107,.07)}
.tag.bad{color:var(--bad);background:rgba(239,130,145,.07)}
.tag.info{color:var(--info);background:rgba(127,187,239,.07)}
.infragrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.infra{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:13px}
.infra .label{font-size:11px;color:var(--muted);margin-bottom:6px}
.infra .value{font-size:15px;font-weight:800;line-height:1.45}
.infra .meaning{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.timeline{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.event{min-width:180px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px}
.event .date{font-size:11px;color:var(--muted);margin-bottom:5px}
.event b{font-size:13px}
details{margin-top:10px;border-top:1px solid var(--border);padding-top:9px}
summary{cursor:pointer;color:#cdbfff;font-weight:700;font-size:13px}
.rawgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.rawbox{background:#101017;border:1px solid var(--border);border-radius:10px;padding:9px}
.rawbox b{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#ddd8ef;margin-top:4px}
.filebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
#headerText{min-height:160px;width:100%;resize:vertical;background:#101017;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.comparegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.compare{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:10px}
.compare .label{font-size:11px;color:var(--muted);margin-bottom:5px}
.compare .value{font-weight:700;font-size:13px}
.pivot{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.pivot:last-child{border-bottom:0}
.pivot b{font-size:13px}
.pivot p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.actions{display:flex;gap:7px;flex-wrap:wrap}
select,textarea{width:100%;background:#101017;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px}
.notesgrid{display:grid;grid-template-columns:250px 1fr;gap:10px}
.footerTop{text-align:center;margin-top:22px}
#floatTop{
 position:fixed;right:22px;bottom:22px;z-index:30;width:46px;height:46px;border-radius:999px;
 border:0;background:var(--accent);color:#140f20;font-size:20px;font-weight:900;cursor:pointer;display:none;box-shadow:var(--shadow)
}
#floatTop.show{display:block}
@media(max-width:820px){
 .topbar{align-items:flex-start}.layout{grid-template-columns:1fr}.card.full{grid-column:auto}
 .infragrid,.comparegrid,.rawgrid{grid-template-columns:1fr}
 .notesgrid{grid-template-columns:1fr}
}
@media(max-width:620px){
 .shell{padding:18px 12px 60px}.topbar{display:block}.langswitch{margin-top:12px}
 .searchbar{flex-wrap:wrap}.searchbar input{min-width:100%}
 .kv{grid-template-columns:1fr}.k{font-size:11px;margin-top:5px}
 .pivot{align-items:flex-start;flex-direction:column}
}

.loaderWrap{display:flex;align-items:center;gap:12px}
.cube{
  width:28px;height:28px;position:relative;transform-style:preserve-3d;
  animation:cubeSpin 1.15s linear infinite;flex:0 0 auto
}
.cube::before,.cube::after{
  content:"";position:absolute;inset:0;border:2px solid var(--accent);border-radius:5px
}
.cube::after{transform:rotateY(90deg);border-color:var(--info)}
@keyframes cubeSpin{
  0%{transform:rotateX(0deg) rotateY(0deg)}
  50%{transform:rotateX(180deg) rotateY(180deg)}
  100%{transform:rotateX(360deg) rotateY(360deg)}
}
.loadingDots::after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
.progressTrack{height:4px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;margin-top:12px}
.progressBar{height:100%;width:30%;background:linear-gradient(90deg,var(--accent),var(--info));border-radius:999px;animation:progressMove 1.4s ease-in-out infinite}
@keyframes progressMove{0%{transform:translateX(-120%)}50%{transform:translateX(170%)}100%{transform:translateX(360%)}}

</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>Domain Backstory</h1>
      <p id="subtitle"></p>
    </div>
    <div class="langswitch">
      <button id="langKo">한국어</button>
      <button id="langEn">English</button>
    </div>
  </header>

  <div class="searchbar">
    <input id="domain" type="text" autocomplete="off">
    <button id="go" class="btn primary"></button>
  </div>

  <div class="statusline">
    <span id="s-rdap" class="status wait"></span>
    <span id="s-dns" class="status wait"></span>
    <span id="s-wb" class="status wait"></span>
  </div>

  <section class="heroSummary">
    <div class="eyebrow" id="summaryEyebrow"></div>
    <h2 id="qsHeadline"></h2>
    <p id="qsBody"></p>
    <div class="next" id="qsNext"></div>
  </section>

  <main class="layout">
    <section class="card">
      <div class="cardhead"><h3 id="h-stands"></h3><span class="hint" id="h-stands-hint"></span></div>
      <div id="signal"></div>
      <div id="flags"></div>
    </section>

    <section class="card">
      <div class="cardhead"><h3 id="h-reg"></h3><span class="hint">RDAP</span></div>
      <div id="rdap"></div>
    </section>

    <section class="card full">
      <div class="cardhead"><h3 id="h-life"></h3><span class="hint" id="h-life-hint"></span></div>
      <div id="lifecycle"></div>
    </section>

    <section class="card full">
      <div class="cardhead"><h3 id="h-time"></h3></div>
      <div id="timeline"></div>
    </section>

    <section class="card">
      <div class="cardhead"><h3 id="h-infra"></h3><span class="hint" id="h-infra-hint"></span></div>
      <div id="infra"></div>
    </section>

    <section class="card">
      <div class="cardhead"><h3 id="h-web"></h3><span class="hint">Wayback</span></div>
      <div id="wb"></div>
    </section>

    <section class="card full">
      <div class="cardhead"><h3 id="h-header"></h3><span class="hint" id="h-header-hint"></span></div>
      <p id="headerHelp" class="muted"></p>
      <div class="filebar">
        <input id="headerFile" type="file" accept=".txt,.eml,text/plain,message/rfc822">
        <button id="parseHeader" class="btn secondary"></button>
        <button id="useFrom" class="btn ghost"></button>
      </div>
      <textarea id="headerText"></textarea>
      <div id="headerResult"></div>
    </section>

    <section class="card full">
      <div class="cardhead"><h3 id="h-pivots"></h3></div>
      <div class="pivot"><div><b>VirusTotal</b><p id="p-vt"></p></div><button id="vtBtn" class="btn secondary">VirusTotal</button></div>
      <div class="pivot"><div><b>Cisco Talos</b><p id="p-talos"></p></div><button id="talosBtn" class="btn secondary">Talos</button></div>
      <div class="pivot"><div><b>Historical WHOIS</b><p id="p-whois"></p></div><div class="actions"><button id="dtBtn" class="btn ghost">DomainTools</button><button id="stBtn" class="btn ghost">SecurityTrails</button></div></div>
      <div class="pivot"><div><b>Wayback</b><p id="p-wayback"></p></div><button id="wbBtn" class="btn ghost">Wayback</button></div>
      <div class="pivot"><div><b>Certificate Transparency</b><p id="p-ct"></p></div><button id="ctBtn" class="btn ghost">CT</button></div>
      <div id="ctResult" class="muted"></div>
    </section>

    <section class="card full">
      <div class="cardhead"><h3 id="h-notes"></h3></div>
      <div class="notesgrid">
        <select id="disp"></select>
        <textarea id="notes"></textarea>
      </div>
      <div class="actions" style="margin-top:10px">
        <button id="save" class="btn primary"></button>
        <button id="copy" class="btn secondary"></button>
      </div>
      <div id="saved" class="muted" style="margin-top:8px"></div>
    </section>
  </main>

  <div class="footerTop"><button id="bottomTopBtn" class="btn secondary"></button></div>
</div>

<button id="floatTop" aria-label="Back to top">↑</button>

function clean(x){x=(x||"").trim().toLowerCase();if(x.includes("@")&&!x.includes("://"))x=x.split("@").pop();try{if(x.includes("://"))x=new URL(x).hostname}catch{}return x.split("/")[0].split(":")[0].replace(/^\.+|\.+$/g,"")}
async function api(path,timeoutMs=12000){

/* Header parsing */
function unfold(raw){return raw.replace(/\r?\n[ \t]+/g," ")}
function headerValues(raw,name){const u=unfold(raw),re=new RegExp("^"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+":\\s*(.*)$","gmi");let m,a=[];while((m=re.exec(u)))a.push(m[1].trim());return a}

function sendingProvider(text){const s=String(text||"").toLowerCase(),rules=[["Mailgun",["mailgun"]],["SendGrid",["sendgrid"]],["Mandrill",["mandrill"]],["Amazon SES",["amazonses"]],["Microsoft 365",["outbound.protection.outlook.com","protection.outlook.com"]],["Google Workspace",["google.com","googlemail.com"]],["Proofpoint",["pphosted","proofpoint"]],["Sophos",["hydra.sophos.com","sophos.com"]],["Mimecast",["mimecast.com"]]];for(const [n,needles] of rules)if(needles.some(x=>s.includes(x)))return n;return null}
function parseAuth(raw){const all=headerValues(raw,"Authentication-Results").join(" ; ");return{raw:all,spf:(all.match(/\bspf=(pass|fail|softfail|neutral|temperror|permerror|none)\b/i)||[])[1]?.toLowerCase()||null,dkim:(all.match(/\bdkim=(pass|fail|neutral|temperror|permerror|none)\b/i)||[])[1]?.toLowerCase()||null,dmarc:(all.match(/\bdmarc=(pass|fail|bestguesspass|none)\b/i)||[])[1]?.toLowerCase()||null,mailfrom:(all.match(/smtp\.mailfrom=([^\s;]+)/i)||[])[1]?.replace(/[<>]/g,"")||null,headerFrom:(all.match(/header\.from=([^\s;]+)/i)||[])[1]||null,dkimDomain:(all.match(/header\.d=([^\s;]+)/i)||[])[1]||null}}
function parseHeader(raw){const from=headerValues(raw,"From")[0]||null,ret=headerValues(raw,"Return-Path")[0]||null,received=headerValues(raw,"Received"),auth=parseAuth(raw),recText=received.join("\n");return{fromDomain:emailDomain(from)||auth.headerFrom,returnDomain:emailDomain(ret)||domainFromToken(auth.mailfrom),receivedCount:received.length,publicIPs:publicIPs(recText),observedProvider:sendingProvider(recText+" "+ret+" "+auth.raw),auth}}
async function analyzeHeader(){const raw=$("#headerText").value;if(!raw.trim())return alert(LANG==="ko"?"헤더를 붙여넣거나 파일을 올리세요.":"Paste or upload a header first.");parsedHeader=parseHeader(raw);if(parsedHeader.fromDomain&&!current){$("#domain").value=parsedHeader.fromDomain;await investigate()}else renderHeaderComparison()}
function renderHeaderComparison(){
 const h=parsedHeader;if(!h)return;const m=current?.maildns||{};
 const boxes=[[T("fromDomain"),h.fromDomain||"—"],[T("returnDomain"),h.returnDomain||"—"],[T("dkimDomain"),h.auth.dkimDomain||"—"],[T("observedProvider"),h.observedProvider||"—"],[T("publicIPs"),h.publicIPs.slice(0,4).join(", ")||"—"],[T("receivedHops"),String(h.receivedCount)]];
 let html=`<div class="comparegrid">${boxes.map(([l,v])=>`<div class="compare"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div></div>`).join("")}</div>`;
 html+=`<div class="kv" style="margin-top:12px">${kvRow(T("spfResult"),h.auth.spf||"—",h.auth.spf==="pass"?"good":"info")}${kvRow(T("dkimResult"),h.auth.dkim||"—",h.auth.dkim==="pass"?"good":"info")}${kvRow(T("dmarcResult"),h.auth.dmarc||"—",h.auth.dmarc==="pass"?"good":"info")}${kvRow(T("currentSPF"),m.spf||"—")}${kvRow(T("currentDMARC"),m.dmarc||"—")}</div>`;
 const notes=[];if(h.auth.dmarc==="fail")notes.push(["bad",T("authFail"),LANG==="ko"?"스푸핑 또는 alignment 실패 가능성을 확인하세요.":"Check spoofing or alignment failure."]);
 if(h.auth.spf==="pass"&&h.auth.dkim==="pass"&&h.auth.dmarc==="pass")notes.push(["good",T("authPass"),LANG==="ko"?"단순 From 스푸핑 가능성은 낮아집니다.":"Simple visible-From spoofing is less likely."]);
 if(current?.dns?.MX?.length&&h.observedProvider)notes.push(["info",T("mxNotOutbound"),T("meaningMX")]);
 if(h.auth.spf==="pass"&&h.auth.dkim==="pass"&&h.auth.dmarc==="pass"&&h.observedProvider)notes.push(["warn",LANG==="ko"?"악성이라면 승인된 인프라 악용 확인":"If malicious, investigate authorized-infrastructure abuse",T("authAbuse")]);
 html+=notes.map(([c,t,b])=>`<div class="notice ${c}" style="margin-top:9px"><b>${esc(t)}</b><p>${esc(b)}</p></div>`).join("");
 $("#headerResult").innerHTML=html;renderQuickSummary();
}

function domain(){return current?.domain||clean($("#domain").value)}
function openUrl(kind){const d=domain();if(!d)return;const urls={talos:"https://www.talosintelligence.com/reputation_center",vt:"https://www.virustotal.com/gui/domain/"+encodeURIComponent(d),dt:"https://whois.domaintools.com/"+encodeURIComponent(d),st:"https://securitytrails.com/domain/"+encodeURIComponent(d)+"/history",wb:"https://web.archive.org/web/*/"+encodeURIComponent(d)+"/*"};window.open(urls[kind],"_blank","noopener")}
async function ct(){const d=domain();if(!d)return;$("#ctResult").textContent=T("loading");try{const x=await api("/api/ct?domain="+encodeURIComponent(d));$("#ctResult").textContent=LANG==="ko"?`CT 결과: 인증서 ${x.unique_certificates}개, 호스트명 ${x.unique_names}개, 최근 관찰 ${fmt(x.newest)}`:`CT: ${x.unique_certificates} certs, ${x.unique_names} hostnames, newest ${fmt(x.newest)}`}catch(e){$("#ctResult").textContent=LANG==="ko"?"CT 조회 불가 — 핵심 판정에는 영향 없음":"CT unavailable — does not affect the primary assessment"}}
function storageKey(){return"domainBackstory:"+domain()}
function loadSaved(){const x=JSON.parse(localStorage.getItem(storageKey())||"null");if(x){$("#disp").selectedIndex=x.dispIndex??0;$("#notes").value=x.notes||""}}
function saveLocal(){localStorage.setItem(storageKey(),JSON.stringify({dispIndex:$("#disp").selectedIndex,notes:$("#notes").value}));$("#saved").textContent=LANG==="ko"?"이 브라우저에 저장됨":"Saved in this browser"}
function summaryText(){const r=current?.rdap||{},d=current?.dns||{},m=current?.maildns||{},h=parsedHeader||{};return `Domain: ${domain()}\nCreated: ${fmt(r.created)}\nChanged: ${fmt(r.changed)}\nRegistrar: ${r.registrar||"—"}\nMX: ${(d.MX||[]).join(", ")||"—"}\nSPF: ${m.spf||"—"}\nObserved provider: ${h.observedProvider||"—"}\nSPF/DKIM/DMARC: ${h.auth?`${h.auth.spf||"—"} / ${h.auth.dkim||"—"} / ${h.auth.dmarc||"—"}`:"—"}\nNotes: ${$("#notes").value}`}

$("#go").onclick=investigate;$("#domain").onkeydown=e=>{if(e.key==="Enter")investigate()};
$("#langKo").onclick=()=>setLanguage("ko");$("#langEn").onclick=()=>setLanguage("en");
$("#headerFile").onchange=async e=>{const f=e.target.files?.[0];if(f)$("#headerText").value=await f.text()};
$("#parseHeader").onclick=analyzeHeader;$("#useFrom").onclick=()=>{if(parsedHeader?.fromDomain){$("#domain").value=parsedHeader.fromDomain;investigate()}};
$("#vtBtn").onclick=()=>openUrl("vt");$("#talosBtn").onclick=()=>openUrl("talos");$("#dtBtn").onclick=()=>openUrl("dt");$("#stBtn").onclick=()=>openUrl("st");$("#wbBtn").onclick=()=>openUrl("wb");$("#ctBtn").onclick=ct;
$("#save").onclick=saveLocal;$("#copy").onclick=async()=>{await navigator.clipboard.writeText(summaryText());$("#saved").textContent=LANG==="ko"?"요약 복사됨":"Summary copied"};
$("#bottomTopBtn").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});$("#floatTop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.addEventListener("scroll",()=>$("#floatTop").classList.toggle("show",window.scrollY>650));
setLanguage(LANG);
</script>
